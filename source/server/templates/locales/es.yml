tooltips:
  showPassword: Mostrar el texto de la contraseña
  permissions: >
    El acceso predeterminado para los usuarios conectados no puede ser más restrictivo que el acceso público.
    Se aplican los derechos más amplios entre el acceso predeterminado y los derechos específicos del usuario.
  sortBy: >
    <b>Relevancia</b> ordena los resultados según su coincidencia con la búsqueda; solo tiene sentido
    cuando hay un término de búsqueda. Los demás criterios se basan en la fecha o el nombre e ignoran la búsqueda.
  myAccess: >
    Limita los resultados a las escenas sobre las que tiene al menos este nivel de derechos.
    Los administradores pueden dejarlo vacío para ver todas las escenas de la instancia.
leads:
