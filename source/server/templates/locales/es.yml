    Los tokens de API permiten que servicios y scripts de terceros hagan solicitudes autenticadas en su nombre, sin su contraseña. Se pueden revocar en cualquier momento
  scopeLadder: >
    Cada familia de alcances es una escala: un nivel incluye todos los niveles inferiores (read < write < admin), por lo que solo se guarda el nivel más alto seleccionado
  scopeHint: ○ = sin acceso · relleno = otorgado · haga clic en el nivel seleccionado para quitarlo
  noTokens: No hay tokens de API
  authorize: solicita acceso a su cuenta de eCorpus, como
  authorizedApps: >
    Aplicaciones a las que permitió acceder a su cuenta. Mientras mantenga la sesión iniciada, renuevan su acceso automáticamente sin volver a preguntar. Revocar una aplicación detiene esa renovación e invalida los tokens que tiene
  noAuthorizedApps: No hay aplicaciones autorizadas
  revokeGrant: Revocar el acceso de esta aplicación y sus tokens
  tokenCreated: >
    Este es su nuevo token. Cópielo ahora: no se volverá a mostrar
  appLead: >
    eCorpus es una base de datos de escenas 3D que usa un editor de escenas enriquecido
    compartido con la Digitization Program Office de la Smithsonian Institution
  passwordRecovery: >
