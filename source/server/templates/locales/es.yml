onboarding:
  import:
    title: "Importe sus modelos"
    lead: "Suba un archivo de modelo 3D"
    link: "Tutorial: crear una escena"
  annotate:
    title: "Anote y enriquezca"
    lead: "Abra Voyager-Story y agregue artículos, medios y anotaciones"
    link: "Tutorial: agregar contenido"
  publish:
    title: "Publique y comparta"
    lead: "Administre los permisos de acceso e inserte el visor en su sitio web"
    link: "Tutorial de publicación"
  upload:
    title: "¿Necesita ayuda?"
    lead: >
      Arrastre sus archivos al área de arriba o haga clic para buscarlos.
    types: Tipos de archivo aceptados
    glb:
      title: "Modelo 3D individual"
      lead: >
        Un archivo <code>.glb</code> (o <code>.gltf</code>) crea una escena nueva con
        metadatos predeterminados.
    optimize:
      title: "Conversión y optimización"
      lead: >
        Active <i>Optimizar modelos</i> para comprimir la geometría y las texturas. Se recomienda para archivos de más de unos pocos megabytes: la subida se ejecuta como una
        tarea en segundo plano y la escena resultante carga mucho más rápido en los visores.
    zip:
      title: "Subida de un archivo ZIP"
      lead: >
        Un archivo <code>.zip</code> puede contener una o varias escenas completas de eCorpus
        (modelos, artículos, anotaciones y miniaturas). Los nombres de las escenas se toman
        del archivo, así que el campo de nombre de arriba se ignora.
  group:
    title: "Cómo funcionan los grupos"
    lead: >
      Los grupos reúnen <b>usuarios</b> y <b>escenas</b> y les otorgan un nivel de acceso compartido
      (<i>lectura</i>, <i>escritura</i> o <i>administración</i>). Agregue miembros a la izquierda y luego vincule escenas
      con el permiso deseado a la derecha. Los derechos efectivos de un usuario son los más
      amplios entre sus derechos públicos, predeterminados, de grupo e individuales.
    link: "Leer la documentación de permisos"
  scenePermissions:
    lead: >
      Todavía no se ha otorgado ningún permiso específico sobre esta escena. Cualquiera que cumpla
      las reglas de acceso <i>público</i> o <i>predeterminado</i> de arriba puede acceder a ella. Agregue un grupo o un usuario abajo
      para otorgar derechos adicionales.
  sceneTags:
    lead: >
      Las etiquetas ayudan a otras personas a descubrir esta escena. También sirven para armar las colecciones de
      la página de inicio. Agregue una etiqueta abajo; elija una de las sugerencias existentes para sumarla a una colección.
  userGroups:
    lead: >
      Los grupos permiten a un administrador otorgar el mismo acceso a varios usuarios a la vez.
      Los administran los administradores de la instancia: pida a uno que lo agregue al grupo
      correspondiente si necesita colaborar en escenas que no le pertenecen.
  archives:
    lead: >
      Archivar una escena la quita de los resultados de búsqueda y de su lista de escenas, pero
      conserva sus datos en el servidor. Las escenas archivadas se pueden restaurar en cualquier momento desde
      esta página. El botón «Archivar» está en la configuración de cada escena.
  tags:
    lead: >
      Todavía no se ha creado ninguna etiqueta en esta instancia. Las etiquetas agrupan escenas en <i>colecciones</i>:
      se agregan desde la página de configuración de cada escena y aquí se convierten en páginas de colección.
    link: "Tutorial de etiquetas y colecciones"
  tagEmpty:
    lead: >
      Esta colección no tiene, por ahora, ninguna escena visible para usted. Puede que la etiqueta se haya
      quitado de todas las escenas o que usted no tenga acceso de lectura a las escenas correspondientes.
    link: "Ver todas las colecciones"
  tasks:
    lead: >
      Las tareas son trabajos en segundo plano que el servidor ejecuta en su nombre; por lo general, subidas
      de escenas, extracciones de archivos ZIP u optimizaciones de modelos. Cada tarea guarda sus registros
      y un espacio de trabajo descargable que sirve para diagnosticar fallos.
    link: "Acerca de las tareas en segundo plano"

