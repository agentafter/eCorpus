    Este es el historial de cambios de la escena, agrupado por día. Despliegue los grupos con los íconos <span class="text-primary">+</span> para ver más detalles.
    Haga clic en <code class="text-primary">restaurar a</code> para agregar un conjunto de cambios que devuelva el contenido de la escena a como estaba en ese momento.
