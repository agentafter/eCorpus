name: Publish
# Huaka: publica la imagen del fork en ghcr.io/agentafter/e-corpus, solo al
# hacer merge a main. No despliega nada: staging y producción se actualizan
# aparte (ver AGENTS.md §14). Upstream publicaba en holusion/e-corpus.
on:
  push:
    branches:
      - "main"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentafter/e-corpus

concurrency: 
  group: publish-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  docker-publish:
    name: Docker Image
    if: github.repository == 'agentafter/eCorpus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name : Compute short sha
        id   : ref
        run  : |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "id=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ github.ref_name }}+`git rev-parse --short HEAD`" >> $GITHUB_OUTPUT
          fi
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<commit>: tag inmutable para staging/producción y rollback
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest
          # El Dockerfile de upstream declara vendor "Holusion SAS"; esta imagen
          # no la publica Holusion (AGENTS.md §1.6). La licencia va explícita:
          # metadata-action la toma de la detección de GitHub, que en este repo
          # (sin LICENSE en la raíz, igual que upstream) queda vacía y pisa el
          # Apache-2.0 del Dockerfile.
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Huaka Digital
            org.opencontainers.image.description=eCorpus (Holusion, Apache-2.0) con personalización de Huaka Digital
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_REF=${{ steps.ref.outputs.id }}
  clean:
    name: Clean package
    if: github.repository == 'agentafter/eCorpus'
    needs: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/delete-package-versions@v5
      with: 
        package-name: 'e-corpus'
        package-type: 'container'
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'true'